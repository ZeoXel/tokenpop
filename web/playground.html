<style>
/* Layout: a single working console. Controls on top, one or two terminal panes, a composer at the bottom. */
:root {
  --bg: #f4f2f7;
  --panel: #ffffff;
  --panel-2: #f8f6fb;
  --line: #e1dce8;
  --fg: #1c1922;
  --dim: #6c6578;
  --pop: #d2397f;
  --think: #4d5bd1;
  --tool: #9a6a00;
  --ok: #1d8450;
  --err: #c43333;
  --pop-soft: rgba(210, 57, 127, .10);
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
    --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --err: #ff6b6b; --pop-soft: rgba(255, 125, 181, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
  --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --err: #ff6b6b; --pop-soft: rgba(255, 125, 181, .12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.02em; line-height: 1; display: inline-flex; align-items: baseline; }
.wordmark .dot { display: inline-block; width: .32em; height: .32em; border-radius: 50%; background: var(--pop); margin-left: .08em; transform-origin: center; }
.wordmark .dot.hit { animation: hit .16s ease-out; }
@keyframes hit { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
.tagline { color: var(--dim); font-size: 14px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: 500 13px var(--font-ui); color: var(--dim); background: transparent; border: 0; padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--pop-soft); box-shadow: inset 0 -2px 0 var(--pop); }
.seg button:focus-visible, .send:focus-visible, .switch input:focus-visible + span, input[type=range]:focus-visible { outline: 2px solid var(--pop); outline-offset: 2px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.switch input:checked + span { background: var(--think); }
.switch input:checked + span::after { transform: translateX(12px); }
input[type=range] { width: 110px; accent-color: var(--pop); }

.scenarios { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Stage */
.stage { display: grid; grid-template-columns: 1fr; gap: 14px; }
.stage.duet { grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .stage.duet { grid-template-columns: 1fr; } }

.pane { min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 12.5px; }
.pane-title { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pane-title b { font-weight: 600; white-space: nowrap; }
.pane-title .cwd { color: var(--dim); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan { font: 600 10.5px var(--font-mono); color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.state { font: 500 12px var(--font-mono); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--dim); }
.state i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.state[data-s="thinking"] { color: var(--think); } .state[data-s="thinking"] i { background: var(--think); }
.state[data-s="writing"] { color: var(--pop); } .state[data-s="writing"] i { background: var(--pop); }
.state[data-s="tool"] { color: var(--tool); } .state[data-s="tool"] i { background: var(--tool); }
.state[data-s="done"] { color: var(--ok); } .state[data-s="done"] i { background: var(--ok); }

.log { font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 14px 16px 18px; height: clamp(320px, 52vh, 560px); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; overflow-wrap: anywhere; }
.stage.duet .log { height: clamp(300px, 46vh, 520px); }
@media (max-width: 760px) { .stage.duet .log { height: 300px; } }
.welcome { color: var(--dim); display: flex; flex-direction: column; gap: 6px; }
.welcome .k { color: var(--fg); }
.user { color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.user::before { content: "› "; color: var(--pop); font-weight: 600; }

.think { color: var(--dim); }
.think .th { color: var(--think); font-size: 12px; cursor: pointer; user-select: none; display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; }
.think .th::before { content: "✻"; }
.think .tb { font-style: italic; white-space: pre-wrap; max-height: 7.5em; overflow: hidden; margin-top: 2px; border-left: 2px solid var(--line); padding-left: 10px; display: flex; flex-direction: column-reverse; }
.think.closed .tb { display: none; }

.say { white-space: pre-wrap; }
.say code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
.say strong { font-weight: 600; }

.tool { display: flex; flex-direction: column; gap: 3px; }
.tool .call { display: flex; gap: 8px; align-items: baseline; }
.tool .call i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--tool); transform: translateY(-1px); }
.tool.running .call i { animation: blink 1s steps(2, start) infinite; }
.tool.ok .call i { background: var(--ok); }
.tool.bad .call i { background: var(--err); }
.tool .name { color: var(--tool); font-weight: 600; }
.tool .arg { color: var(--fg); }
.tool .raw { color: var(--dim); font-size: 12px; white-space: pre-wrap; padding-left: 16px; }
.tool .out { color: var(--dim); font-size: 12px; white-space: pre-wrap; padding-left: 16px; position: relative; }
.tool .out::before { content: "⎿"; position: absolute; left: 2px; color: var(--line); }
.tool.bad .out { color: var(--err); }

.caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -0.18em; background: var(--pop); margin-left: 1px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.lane { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; padding: 6px 14px 8px; border-top: 1px solid var(--line); background: var(--panel-2); }
.lane-labels { display: grid; gap: 2px; font: 600 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.lane canvas { width: 100%; height: 40px; display: block; }
.lane-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font: 11px var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px; }

/* Composer */
.composer { display: flex; gap: 10px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 14px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--fg); font: 13.5px/1.5 var(--font-mono); height: 3.2em; outline: none; }
.send { flex: none; align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; font: 600 14px var(--font-ui); color: #fff; background: var(--pop); border: 0; border-radius: 9px; padding: 10px 16px; cursor: pointer; }
.send:hover { filter: brightness(1.06); }
.send svg { width: 15px; height: 15px; }
.send.stop { background: var(--fg); color: var(--bg); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; color: var(--dim); font-size: 12.5px; }
.foot a { color: inherit; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; }
.note { color: var(--dim); font-size: 12.5px; }

@media (prefers-reduced-motion: reduce) {
  .wordmark .dot.hit, .caret, .tool.running .call i { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="wordmark" aria-label="tokenpop">tokenpop<span class="dot" id="logo-dot"></span></div>
      <div class="tagline">Hear your agents think. Press Send and listen.</div>
    </div>
    <div class="controls">
      <div class="ctl">
        <span class="ctl-label" id="pack-label">Sound</span>
        <div class="seg" role="group" aria-labelledby="pack-label" id="pack-seg">
          <button type="button" data-pack="blip" aria-pressed="true">Blip</button>
          <button type="button" data-pack="mech" aria-pressed="false">Mech</button>
          <button type="button" data-pack="chip" aria-pressed="false">Chip</button>
        </div>
      </div>
      <label class="switch" for="think-sound"><input type="checkbox" id="think-sound" checked><span></span>Thinking sound</label>
      <div class="ctl">
        <label class="ctl-label" for="vol">Volume</label>
        <input type="range" id="vol" min="0" max="100" value="55">
      </div>
    </div>
  </header>

  <div class="scenarios">
    <span class="ctl-label" id="scn-label">Session</span>
    <div class="seg" role="group" aria-labelledby="scn-label" id="scn-seg">
      <button type="button" data-scn="A" aria-pressed="true">Fix a failing test</button>
      <button type="button" data-scn="B" aria-pressed="false">Explain a file</button>
      <button type="button" data-scn="duet" aria-pressed="false">Two agents at once</button>
    </div>
    <span class="note" id="duet-note" hidden>Headphones help: agent 1 sits left, agent 2 sits right.</span>
  </div>

  <main class="stage" id="stage"></main>

  <form class="composer" id="composer">
    <textarea id="prompt" readonly aria-label="Prompt"></textarea>
    <button class="send" id="send" type="submit">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="send-label">Send</span>
    </button>
  </form>

  <footer class="foot">
    <div class="legend" aria-label="Sound legend">
      <span><i style="background:var(--think)"></i>thinking</span>
      <span><i style="background:var(--pop)"></i>writing</span>
      <span><i style="background:var(--tool)"></i>typing a tool call</span>
    </div>
    <div>Replays real DeepSeek Harness sessions recorded with the tokenpop adapter. Sound is synthesized live by a port of the tokenpop engine. <span id="audio-mode"></span></div>
  </footer>
</div>

    el.setAttribute('aria-label', label);
    el.innerHTML =
      '<div class="pane-head"><div class="pane-title"><b>' + label + '</b><span class="cwd">dsh · ~/demo</span>' +
      (chan ? '<span class="chan" title="Stereo position">' + chan + '</span>' : '') + '</div>' +
      '<span class="state" data-s="idle"><i></i><span>idle</span></span></div>' +
      '<div class="log" aria-live="off"></div>' +
      '<div class="lane"><div class="lane-labels"><span>chunks in</span><span>pops out</span></div><canvas></canvas>' +
      '<div class="lane-foot"><span class="lf-l">0 chunks → 0 pops</span><span class="lf-r">0.0s</span></div></div>';
    this.el = el;
    this.log = el.querySelector('.log');
    this.stateEl = el.querySelector('.state');
    this.canvas = el.querySelector('canvas');
    this.lfL = el.querySelector('.lf-l');
    this.lfR = el.querySelector('.lf-r');
    this.caret = document.createElement('span');
    this.caret.className = 'caret';
    this.welcome();
  }
  welcome() {
    this.log.innerHTML =
      '<div class="welcome"><div><span class="k">DeepSeek Harness</span> · recorded session</div>' +
      '<div>Task: ' + esc(this.sess.prompt) + '</div>' +
      '<div>Press <span class="k">Send</span> to replay it with sound.</div></div>';
    this.setState('idle', 'idle');
  }
  setState(s, text) { this.stateEl.dataset.s = s; this.stateEl.lastChild.textContent = text; }
  reset() {
    this.log.innerHTML = '';
    this.cur = null; this.tools = []; this.chunks = 0; this.pops = 0; this.chunkMarks = []; this.popMarks = [];
    const u = document.createElement('div'); u.className = 'user'; u.textContent = this.sess.prompt;
    this.log.appendChild(u);
    this.setState('thinking', 'starting');
  }
  start(delay) { this.reset(); this.t0 = performance.now() + delay; this.i = 0; this.running = true; this.elapsed = 0; }
  stop() { this.running = false; this.caret.remove(); this.closeCur(); }
  tick(now) {
    if (!this.running) return;
    const el = now - this.t0;
    if (el < 0) return;
    this.elapsed = el;
    const ev = this.sess.events;
    const stick = this.log.scrollHeight - this.log.scrollTop - this.log.clientHeight < 40;
    while (this.i < ev.length && ev[this.i][0] <= el) this.dispatch(ev[this.i++]);
    if (this.i >= ev.length) this.finish();
    if (stick) this.log.scrollTop = this.log.scrollHeight;
  }
  finish() {
    this.running = false; this.caret.remove(); this.closeCur();
    this.setState('done', 'done');
    paneFinished();
  }
  sound(kind, extra) { Audio.post({ t: 'ev', ev: Object.assign({ agent: this.id, kind: kind, chars: 0, h: 0 }, extra || {}) }); }
  dispatch(row) {
    const k = row[1];
    if (k === 'text' || k === 'reasoning' || k === 'tool_args') {
      const s = row[2] || '';
      if (k === 'tool_args') this.toolArgs(s, row[3]); else this.stream(k, s);
      if (s) {
        this.chunks++;
        this.chunkMarks.push([performance.now(), k]);
        if (!(k === 'reasoning' && !state.thinkSound)) this.sound(k, { chars: s.length, h: hash8(s) });
      }
    } else if (k === 'tool_start') { this.toolStart(row[2], row[3]); this.sound('tool_start'); }
    else if (k === 'tool_end') { this.toolEnd(row[2], row[3], row[4]); this.sound(row[4] ? 'tool_error' : 'tool_end'); }
    else if (k === 'prompt') this.sound('prompt');
    else if (k === 'done') this.sound('done');
  }
  closeCur() {
    const c = this.cur;
    if (!c) return;
    if (c.kind === 'reasoning') {
      const secs = ((this.elapsed - c.t) / 1000).toFixed(1);
      c.head.textContent = 'Thought for ' + secs + 's';
      c.el.classList.add('closed');
      c.head.setAttribute('aria-expanded', 'false');
    }
    this.cur = null;
  }
  block(kind) {
    if (this.cur && this.cur.kind === kind) return this.cur;
    this.closeCur();
    const el = document.createElement('div');
    const c = { kind: kind, el: el, raw: '', t: this.elapsed };
    if (kind === 'reasoning') {
      el.className = 'think';
      c.head = document.createElement('button');
      c.head.type = 'button'; c.head.className = 'th'; c.head.textContent = 'Thinking…';
      c.head.setAttribute('aria-expanded', 'true');
      c.head.addEventListener('click', () => {
        const closed = el.classList.toggle('closed');
        c.head.setAttribute('aria-expanded', String(!closed));
      });
      c.body = document.createElement('div'); c.body.className = 'tb';
      c.inner = document.createElement('span'); c.body.appendChild(c.inner);
      el.append(c.head, c.body);
      this.setState('thinking', 'thinking');
    } else {
      el.className = 'say';
      c.body = el; c.inner = document.createElement('span'); el.appendChild(c.inner);
      this.setState('writing', 'writing');
    }
    this.log.appendChild(el);
    this.cur = c;
    return c;
  }
  stream(kind, s) {
    const c = this.block(kind);
    c.raw += s;
    if (kind === 'reasoning') c.inner.textContent = c.raw; else c.inner.innerHTML = md(c.raw);
    c.inner.appendChild(this.caret);
  }
  newTool(name) {
    this.closeCur();
    const el = document.createElement('div');
    el.className = 'tool';
    el.innerHTML = '<div class="call"><i></i><span><span class="name"></span><span class="arg"></span></span></div><div class="raw"></div>';
    const t = { kind: 'tool', el: el, name: name || 'tool', raw: '', started: false, ended: false,
      nameEl: el.querySelector('.name'), argEl: el.querySelector('.arg'), rawEl: el.querySelector('.raw') };
    t.nameEl.textContent = TOOL_LABEL[t.name] || t.name;
    this.log.appendChild(el);
    this.tools.push(t);
    this.cur = t;
    this.setState('tool', 'calling ' + t.name);
    return t;
  }
  toolArgs(s, name) {
    let t = this.cur;
    if (name || !t || t.kind !== 'tool') t = this.newTool(name);
    t.raw += s;
    t.rawEl.textContent = t.raw;
    t.rawEl.appendChild(this.caret);
  }
  toolStart(name, summary) {
    let t = this.tools.find((x) => !x.started && x.name === name) || this.tools.find((x) => !x.started);
    if (!t) t = this.newTool(name);
    t.started = true;
    t.el.classList.add('running');
    t.argEl.textContent = '(' + summary + ')';
    t.rawEl.remove();
    if (this.caret.parentNode === t.rawEl) this.caret.remove();
    if (this.cur === t) this.cur = null;
    this.setState('tool', 'running ' + name);
  }
  toolEnd(name, out, err) {
    const t = this.tools.find((x) => x.started && !x.ended && x.name === name) || this.tools.find((x) => x.started && !x.ended);
    if (!t) return;
    t.ended = true;
    t.el.classList.remove('running');
    t.el.classList.add(err ? 'bad' : 'ok');
    const o = document.createElement('div');
    o.className = 'out';
    o.textContent = cleanOut(name, out || '') || '(no output)';
    t.el.appendChild(o);
  }
}

/* ---------------------------------------------------------------------------
 * Lanes: chunk arrivals vs. pops actually played.
 * ------------------------------------------------------------------------- */
let colors = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n) => cs.getPropertyValue(n).trim();
  colors = { text: g('--pop'), reasoning: g('--think'), tool_args: g('--tool'), cue: g('--fg'), line: g('--line'), dim: g('--dim') };
}
const SPAN = 4000;
function drawLane(p, now) {
  const c = p.canvas, dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const y1 = h * 0.28, y2 = h * 0.74;
  g.fillStyle = colors.line;
  g.fillRect(0, y1, w, 1); g.fillRect(0, y2, w, 1);
  const cut = now - SPAN;
  while (p.chunkMarks.length && p.chunkMarks[0][0] < cut) p.chunkMarks.shift();
  while (p.popMarks.length && p.popMarks[0][0] < cut) p.popMarks.shift();
  const X = (t) => w - (now - t) / SPAN * w;
  g.globalAlpha = 0.75;
  for (const [t, k] of p.chunkMarks) { g.fillStyle = colors[k]; g.fillRect(X(t), y1 - 7, 1.5, 14); }
  g.globalAlpha = 1;
  for (const [t, k] of p.popMarks) {
    const x = X(t);
    g.beginPath();
    if (k === 'cue') { g.strokeStyle = colors.cue; g.lineWidth = 1.5; g.arc(x, y2, 5.5, 0, Math.PI * 2); g.stroke(); }
    else { g.fillStyle = colors[k]; g.arc(x, y2, 3.6, 0, Math.PI * 2); g.fill(); }
  }
  const secs = p.running || p.elapsed ? (p.elapsed / 1000).toFixed(1) : '0.0';
  p.lfL.textContent = p.chunks + ' chunks → ' + p.pops + ' pops';
  p.lfR.textContent = secs + 's';
}

/* ---------------------------------------------------------------------------
 * Wiring
 * ------------------------------------------------------------------------- */
let panes = [];
const stage = document.getElementById('stage');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const sendLabel = document.getElementById('send-label');
const dot = document.getElementById('logo-dot');

function onPops(list) {
  const now = performance.now();
  let hit = false;
  for (const [agent, kind] of list) {
    const p = panes.find((x) => x.id === agent);
    if (!p) continue;
    p.popMarks.push([now, kind]);
    if (kind !== 'cue') p.pops++;
    hit = true;
  }
  if (hit) { dot.classList.remove('hit'); void dot.offsetWidth; dot.classList.add('hit'); }
}

function build() {
  stopAll();
  stage.innerHTML = '';
  const duet = state.scn === 'duet';
  stage.classList.toggle('duet', duet);
  document.getElementById('duet-note').hidden = !duet;
  if (duet) {
    panes = [new Pane('A', 'Agent 1', 'L', SESSIONS.A), new Pane('B', 'Agent 2', 'R', SESSIONS.B)];
    promptEl.value = 'Agent 1: ' + SESSIONS.A.prompt + '\nAgent 2: ' + SESSIONS.B.prompt;
  } else {
    panes = [new Pane(state.scn, 'Agent', '', SESSIONS[state.scn])];
    promptEl.value = SESSIONS[state.scn].prompt;
  }
  panes.forEach((p) => stage.appendChild(p.el));
  setSend('send');
}
function setSend(mode) {
  sendBtn.classList.toggle('stop', mode === 'stop');
  sendLabel.textContent = mode === 'stop' ? 'Stop' : mode === 'again' ? 'Send again' : 'Send';
}
function stopAll() { panes.forEach((p) => p.stop()); state.running = false; }
function paneFinished() {
  if (panes.every((p) => !p.running)) { state.running = false; setSend('again'); }
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.running) { stopAll(); panes.forEach((p) => p.setState('idle', 'stopped')); setSend('again'); return; }
  const ready = Audio.init();
  ready.then(() => {
    state.running = true;
    setSend('stop');
    panes.forEach((p, i) => p.start(i * 400));
  });
});

function segment(id, attr, onPick) {
  const seg = document.getElementById(id);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset[attr]);
  });
}
segment('pack-seg', 'pack', (v) => { state.pack = v; Audio.post({ t: 'pack', v: v }); });
segment('scn-seg', 'scn', (v) => { state.scn = v; build(); });
document.getElementById('think-sound').addEventListener('change', (e) => { state.thinkSound = e.target.checked; });
document.getElementById('vol').addEventListener('input', (e) => { state.volume = e.target.value / 100; Audio.setVolume(state.volume); });

function loop(now) {
  for (const p of panes) p.tick(now);
  for (const p of panes) drawLane(p, now);
  requestAnimationFrame(loop);
}
readColors();
setInterval(readColors, 1000);
build();
requestAnimationFrame(loop);
</script>
