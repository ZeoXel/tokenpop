<title>tokenpop Sound Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: themes on top; a layer list on the left drives a voice picker with solo preview on the right; the full-session preview sits below the picker. */
:root {
  --bg: #f4f2f7; --panel: #ffffff; --panel-2: #f8f6fb; --line: #e1dce8; --fg: #1c1922; --dim: #6c6578;
  --pop: #d2397f; --think: #4d5bd1; --tool: #9a6a00; --ok: #1d8450; --pick: #c98a00; --pop-soft: rgba(210, 57, 127, .10);
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
    --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --pick: #ffc94d; --pop-soft: rgba(255, 125, 181, .12); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
  --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --pick: #ffc94d; --pop-soft: rgba(255, 125, 181, .12); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
h1 { font: 700 28px/1.1 var(--font-display); letter-spacing: -.02em; margin: 0; }
h1 span { color: var(--pop); }
h2 { font: 600 15px/1.2 var(--font-display); margin: 0; }
.intro { color: var(--dim); max-width: 62ch; margin: 4px 0 0; }
.top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
.btn { font: 600 13px var(--font-ui); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--pop); border-color: var(--pop); color: #fff; }
.btn svg { width: 12px; height: 12px; }
.status { font: 12px var(--font-mono); color: var(--dim); }
:is(button, select, input):focus-visible { outline: 2px solid var(--pop); outline-offset: 2px; }
input[type=range] { accent-color: var(--pop); }

/* Themes */
.themes { display: flex; align-items: center; gap: 10px; min-width: 0; }
.theme-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; min-width: 0; }
.theme { flex: none; font: 600 13px var(--font-ui); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.theme:hover { border-color: var(--dim); }
.theme[aria-pressed="true"] { border-color: var(--pop); background: var(--pop-soft); }
.theme .star { color: var(--pick); margin-left: 4px; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }

/* Layer list */
.layers { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
@media (max-width: 900px) { .layers { position: static; } }
.layer-list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.layer { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.layer:hover { background: var(--panel-2); }
.layer.active { background: var(--pop-soft); border-color: var(--pop); }
.layer .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.layer.off .dot { background: transparent; border: 1.5px solid var(--line); }
.layer.hit .dot { box-shadow: 0 0 0 4px var(--pop-soft); }
.layer-sel { all: unset; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
.layer-sel b { font-weight: 600; font-size: 13.5px; }
.layer-sel span { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer.off .layer-sel span { text-decoration: line-through; }
.layer-sel:focus-visible { outline: 2px solid var(--pop); outline-offset: 4px; border-radius: 4px; }
.tg { position: relative; display: inline-flex; cursor: pointer; }
.tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.tg input:checked + .sw { background: var(--c, var(--pop)); }
.tg input:checked + .sw::after { transform: translateX(12px); }
.tg input:focus-visible + .sw { outline: 2px solid var(--pop); outline-offset: 2px; }
.layers-foot { padding: 8px 14px 12px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); }

/* Picker */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.picker-title { display: flex; align-items: center; gap: 10px; }
.picker-title i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.picker-title small { color: var(--dim); font-size: 12.5px; font-weight: 400; }
.level { display: flex; align-items: center; gap: 8px; }
.level input { width: 120px; }
.level output { font: 12px var(--font-mono); color: var(--dim); width: 3.5em; font-variant-numeric: tabular-nums; }
.preview { margin: 12px 14px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 8px 12px 10px; height: 136px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 4px; font: 12.5px/1.55 var(--font-mono); }
.preview .pv-label { font: 600 10.5px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview { overflow: hidden; }
.preview > .pv-body { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; overflow-wrap: anywhere; }
.pv-text { white-space: pre-wrap; }
.preview.pv-think .pv-text { color: var(--dim); font-style: italic; }
.preview.pv-typing .pv-text { color: var(--tool); }
.pv-line { color: var(--dim); }
.pv-line b { color: var(--fg); font-weight: 600; }
.pv-line .ok { color: var(--ok); }
.pv-user { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; max-width: 90%; font-family: var(--font-ui); }
.caret { display: inline-block; width: .5em; height: 1em; vertical-align: -0.15em; background: var(--pop); margin-left: 1px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; padding: 12px 14px 14px; }
.tile { position: relative; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 9px 30px 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; font: inherit; }
.tile:hover { border-color: var(--dim); }
.tile[aria-checked="true"] { border-color: var(--pop); box-shadow: inset 0 0 0 1px var(--pop); background: var(--pop-soft); }
.tile b { font: 700 14.5px/1.2 var(--font-display); }
.tile span { color: var(--dim); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.off b { color: var(--dim); }
.tile.sounding::after { content: ""; position: absolute; left: 11px; right: 30px; bottom: 5px; height: 2px; border-radius: 1px; background: var(--pop); animation: grow var(--dur, 2s) linear forwards; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.star { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 3px; border-radius: 4px; }
.star[aria-pressed="true"] { color: var(--pick); }

/* Full session */
.phases { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.ph { font: 600 11px var(--font-mono); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; display: inline-flex; align-items: center; gap: 5px; }
.ph i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.ph.on { color: var(--fg); border-color: var(--dim); }
.ph.on i { background: var(--c); }
.ph.off { text-decoration: line-through; opacity: .5; }
.log { font: 12.5px/1.6 var(--font-mono); padding: 10px 14px 14px; height: 260px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 9px; overflow-wrap: anywhere; }
.log .hint { color: var(--dim); }
.user { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.user::before { content: "› "; color: var(--pop); font-weight: 600; }
.think { color: var(--dim); font-style: italic; white-space: pre-wrap; border-left: 2px solid var(--think); padding-left: 9px; }
.think.closed { font-style: normal; color: var(--think); border-left-color: transparent; padding-left: 0; }
.say { white-space: pre-wrap; }
.say code, .pv-body code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
.say strong, .pv-body strong { font-weight: 600; }
.tool .call { display: flex; gap: 7px; align-items: baseline; }
.tool .call i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tool); }
.tool.ok .call i { background: var(--ok); }
.tool .nm { color: var(--tool); font-weight: 600; }
.tool .raw, .tool .out { color: var(--dim); font-size: 11.5px; white-space: pre-wrap; padding-left: 14px; }
.prog { height: 3px; background: var(--line); border-radius: 0 0 12px 12px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--pop); }
.vol { display: flex; align-items: center; gap: 8px; }
#vol { width: 90px; }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .tile.sounding::after { animation: none; transform: scaleX(1); } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>tokenpop <span>Sound Lab</span></h1>
      <p class="intro">Pick a layer, then click voices to hear that layer on its own. Start from a theme to set every layer at once. Star the voices that should ship first.</p>
    </div>
    <div class="top-actions">
      <div class="vol"><label class="label" for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="55"></div>
      <button class="btn primary" id="copy" type="button">Copy config</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="themes">
    <span class="label" id="themes-label">Theme</span>
    <div class="theme-row" id="themes" role="group" aria-labelledby="themes-label"></div>
  </div>

  <div class="layout">
    <section class="panel layers" aria-label="Sound layers">
      <div class="panel-head"><h2>Layers</h2><button class="btn" id="reset" type="button">Reset</button></div>
      <ul class="layer-list" id="layer-list"></ul>
      <div class="layers-foot">Select a layer to choose its voice. The switch turns a layer off.</div>
    </section>

    <div class="main">
      <section class="panel" aria-label="Voice picker" id="picker">
        <div class="panel-head">
          <div class="picker-title" id="picker-title"></div>
          <div class="level">
            <label class="label" for="level">Level</label>
            <input type="range" id="level" min="0" max="150" step="5">
            <output id="level-out" for="level"></output>
            <button class="btn" id="solo" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Play layer</button>
          </div>
        </div>
        <div class="preview" id="preview" aria-hidden="true"><span class="pv-label" id="pv-label">Solo preview</span><div class="pv-body" id="pv-body"></div></div>
        <div class="tiles" id="tiles" role="radiogroup"></div>
      </section>

      <section class="panel" aria-label="Full session">
        <div class="panel-head">
          <h2>All layers together</h2>
          <button class="btn primary" id="full" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span>Play full session</span></button>
        </div>
        <div class="phases" id="phases"></div>
        <div class="log" id="log"></div>
        <div class="prog"><i id="prog"></i></div>
      </section>
    </div>
  </div>
</div>

    fullSend('think', 'reasoning', { chars: r[2].length, h: hash8(r[2]) });
  } else if (k === 'text') {
    const s = r[2], fresh = !(view.cur && view.cur.kind === 'text'), c = block('text', el);
    if (fresh || (/\n\s*\n/.test(c.raw.slice(-2) + s) && !/\n\s*\n/.test(c.raw.slice(-2)))) fullSend('para', 'para');
    c.raw += s; c.el.innerHTML = md(c.raw); c.el.appendChild(caret);
    fullSend('write', 'text', { chars: s.length, h: hash8(s) });
  } else if (k === 'tool_args') {
    let t = view.cur;
    if (r[3] || !t || t.kind !== 'tool') { closeCur(el); t = newTool(r[3] || 'tool'); }
    t.raw += r[2]; const raw = t.el.querySelector('.raw'); raw.textContent = t.raw; raw.appendChild(caret);
    if (r[2]) fullSend('typing', 'tool_args', { chars: r[2].length, h: hash8(r[2]) });
  } else if (k === 'tool_start') {
    const t = view.tools.find((x) => !x.started && x.name === r[2]) || view.tools.find((x) => !x.started) || newTool(r[2]);
    t.started = true; t.el.querySelector('.arg').textContent = '(' + r[3] + ')';
    const raw = t.el.querySelector('.raw'); if (raw) raw.remove();
    if (view.cur === t) view.cur = null;
    fullSend('tool', 'tool_start');
  } else if (k === 'tool_end') {
    const t = view.tools.find((x) => x.started && !x.ended && x.name === r[2]) || view.tools.find((x) => x.started && !x.ended);
    if (t) { t.ended = true; t.el.classList.add('ok'); const o = document.createElement('div'); o.className = 'out'; o.textContent = '⎿ ' + cleanOut(r[2], r[3] || ''); t.el.appendChild(o); }
    fullSend('tool', 'tool_end');
  } else if (k === 'prompt') fullSend('send', 'prompt');
  else if (k === 'done') { closeCur(el); caret.remove(); fullSend('done', 'done'); }
  const stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  if (stick) logEl.scrollTop = logEl.scrollHeight;
}
function idleLog() {
  logEl.innerHTML = '<div class="hint">Play the full session to hear every layer together, in sync with what the agent is doing.</div>';
  phasesEl.querySelectorAll('.ph').forEach((x) => x.classList.remove('on'));
}
function setFullBtn(playing) {
  fullBtn.querySelector('span').textContent = playing ? 'Stop' : 'Play full session';
  fullBtn.querySelector('svg').innerHTML = playing ? '<rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/>' : '<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>';
}
function playFull() {
  logEl.innerHTML = '';
  const u = document.createElement('div'); u.className = 'user'; u.textContent = SESSION.prompt; logEl.appendChild(u);
  view = { cur: null, tools: [] };
  play(SESSION.events, buildPreset(mix), fullEvent, {
    full: true,
    onStart: () => { setFullBtn(true); },
    onFrame: (el) => { progEl.style.width = Math.min(100, el / (SESSION.events[SESSION.events.length - 1][0] + 700) * 100) + '%'; },
    onStop: () => { setFullBtn(false); caret.remove(); progEl.style.width = '0'; },
  });
}
fullBtn.addEventListener('click', () => { if (clip && clip.full) { stopClip(); idleLog(); } else playFull(); });

/* ---------- Export ---------- */
function config() {
  const srcs = new Set(LAYERS.filter((l) => mix[l.id].on).map((l) => mix[l.id].src));
  const lines = ['# tokenpop sound config', 'theme = "' + (srcs.size === 1 ? [...srcs][0] : 'custom') + '"', ''];
  for (const l of LAYERS) {
    const m = mix[l.id];
    lines.push('[layers.' + l.id + ']');
    lines.push(m.on ? 'voice = "' + m.src + '"\nlevel = ' + m.level : 'enabled = false');
  }
  lines.push('', '# shortlist: ' + (shortlist.length ? shortlist.map((id) => BY_ID[id].name).join(', ') : '(none)'));
  return lines.join('\n');
}
document.getElementById('copy').addEventListener('click', () => {
  const text = config();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
    status(ok ? 'Copied' : 'Copy failed');
  };
  try { navigator.clipboard.writeText(text).then(() => status('Copied'), fallback); } catch (e) { fallback(); }
});
document.getElementById('vol').addEventListener('input', (e) => {
  volume = e.target.value / 100;
  if (Audio.gain) Audio.gain.gain.setTargetAtTime(volToGain(volume), Audio.ctx.currentTime, 0.02);
});

function renderAll() { renderThemes(); renderLayers(); renderPicker(); renderPhases(); }
renderAll(); idleLog();
requestAnimationFrame(tick);
</script>
