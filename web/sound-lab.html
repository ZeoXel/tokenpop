<title>tokenpop Sound Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a quiet-to-lively theme spectrum on top; below, sound positions on the left and the selected position's sound library plus editor on the right; full-session preview last. */
:root {
  --bg: #f4f2f7; --panel: #ffffff; --panel-2: #f8f6fb; --line: #e1dce8; --fg: #1c1922; --dim: #6c6578;
  --pop: #d2397f; --think: #4d5bd1; --tool: #9a6a00; --ok: #1d8450; --err: #c43333; --pick: #c98a00;
  --pop-soft: rgba(210, 57, 127, .10); --quiet: #6a8caf;
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
    --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --err: #ff6b6b; --pick: #ffc94d;
    --pop-soft: rgba(255, 125, 181, .12); --quiet: #8fb3d6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121015; --panel: #1a1720; --panel-2: #15131a; --line: #2b2634; --fg: #ece7f3; --dim: #8f879d;
  --pop: #ff7db5; --think: #9da9ff; --tool: #f0c060; --ok: #6fd39a; --err: #ff6b6b; --pick: #ffc94d;
  --pop-soft: rgba(255, 125, 181, .12); --quiet: #8fb3d6; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1260px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
h1 { font: 700 28px/1.1 var(--font-display); letter-spacing: -.02em; margin: 0; }
h1 span { color: var(--pop); }
h2 { font: 600 15px/1.2 var(--font-display); margin: 0; }
.intro { color: var(--dim); max-width: 66ch; margin: 4px 0 0; }
.top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
.btn { font: 600 13px var(--font-ui); border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--pop); border-color: var(--pop); color: #fff; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 12px; height: 12px; }
.status { font: 12px var(--font-mono); color: var(--dim); }
:is(button, select, input, [tabindex]):focus-visible { outline: 2px solid var(--pop); outline-offset: 2px; }
input[type=range] { accent-color: var(--pop); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }

/* Hero: theme list beside the live app window */
.hero { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; } }
.axis-v { display: flex; align-items: center; gap: 8px; font: 600 10.5px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; padding: 10px 14px 4px; }
.axis-v .bar { flex: 1; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--quiet), var(--pop)); }
.axis-v .q { color: var(--quiet); } .axis-v .l { color: var(--pop); }
.tlist { list-style: none; margin: 0; padding: 4px 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.trow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: center; padding: 6px 34px 6px 10px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
.trow:hover { background: var(--panel-2); }
.trow[aria-pressed="true"] { background: var(--pop-soft); border-color: var(--pop); }
.trow b { font: 700 14px/1.25 var(--font-display); }
.trow .tl { grid-column: 1 / -1; color: var(--dim); font-size: 12px; line-height: 1.4; }
.energy { display: flex; gap: 2px; }
.energy i { width: 7px; height: 4px; border-radius: 2px; background: var(--line); }
.energy i.on { background: color-mix(in srgb, var(--quiet), var(--pop) calc(var(--e) * 10%)); }
.tstar { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 4px; border-radius: 4px; }
.tstar[aria-pressed="true"] { color: var(--pick); }

/* Stage */
.stage-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.stage-left { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
.like { color: var(--dim); font-size: 12px; }
.stage-right { display: flex; align-items: center; gap: 10px; }
.now-pill { font: 600 11px var(--font-mono); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; color: var(--dim); min-width: 132px; }
.now-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--line)); transition: transform .08s; }
.now-pill.hit i { transform: scale(1.6); }
.stage-body { padding: 14px; background: var(--panel-2); }
.stage-prog { height: 3px; background: var(--line); border-radius: 0 0 12px 12px; overflow: hidden; }
.stage-prog i { display: block; height: 100%; width: 0; background: var(--pop); }

.win { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(30, 15, 50, .12); height: 450px; display: flex; flex-direction: column; min-width: 0; }
@media (max-width: 620px) { .win { height: 420px; } }
.chrome { height: 30px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; font: 12px var(--font-ui); }
.chrome .ttl { flex: 1; text-align: center; margin-right: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lights { display: flex; gap: 6px; }
.lights i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.caret { display: inline-block; width: .5em; height: 1em; vertical-align: -0.15em; background: var(--pop); margin-left: 1px; animation: blink 1s steps(2, start) infinite; }

/* Terminal skin: a fixed dark terminal in both page themes */
.term { background: #111116; color: #e7e5ee; border-color: #2a2733; }
.term .chrome { background: #1c1a22; color: #9c97aa; border-bottom: 1px solid #2a2733; }
.t-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; font: 12.5px/1.6 var(--font-mono); display: flex; flex-direction: column; gap: 8px; overflow-wrap: anywhere; }
.t-dim { color: #8d889c; }
.t-banner { color: #8d889c; border: 1px solid #2f2b38; border-radius: 6px; padding: 6px 10px; }
.t-banner b { color: #ff9ac6; font-weight: 600; }
.t-user { color: #e7e5ee; background: #1d1b24; padding: 4px 10px; border-left: 2px solid #8d889c; }
.t-user::before { content: "> "; color: #8d889c; }
.t-think .h { color: #b4bcff; }
.t-think .tx { display: block; color: #8d889c; font-style: italic; white-space: pre-wrap; max-height: 6.4em; overflow: hidden; }
.t-think.closed .tx { display: none; }
.t-say { white-space: pre-wrap; }
.t-say .bul { color: #e7e5ee; }
.t-say code { color: #b4bcff; }
.t-say strong { color: #fff; }
.t-tool .dot::before { content: "⏺ "; }
.t-tool .dot { color: #8d889c; }
.t-tool.run .dot { color: #f0c060; animation: blink 1s steps(2, start) infinite; }
.t-tool.ok .dot { color: #5fd38d; } .t-tool.bad .dot { color: #ff7b7b; }
.t-tool .nm { font-weight: 600; }
.t-tool .raw { color: #8d889c; white-space: pre-wrap; font-size: 11.5px; padding-left: 2ch; }
.t-out { color: #8d889c; white-space: pre-wrap; padding-left: 2ch; }
.t-tool.bad .t-out { color: #ff7b7b; }
.term .caret { background: #e7e5ee; }
.t-status { flex: none; padding: 3px 14px; font: 12px var(--font-mono); color: #ff9ac6; min-height: 22px; }
.t-status .sx { color: #8d889c; }
.t-input { flex: none; margin: 0 10px 10px; border: 1px solid #3a3644; border-radius: 6px; padding: 6px 10px; font: 12.5px var(--font-mono); color: #e7e5ee; min-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-input .gt { color: #8d889c; }
.t-input .cur { display: inline-block; width: .55em; height: 1em; vertical-align: -0.15em; background: #e7e5ee; animation: blink 1s steps(2, start) infinite; }

/* Desktop app skin */
.desk, .ide { background: var(--panel); }
.desk .chrome, .ide .chrome { background: var(--panel-2); border-bottom: 1px solid var(--line); color: var(--dim); }
.d-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 168px minmax(0, 1fr); }
@media (max-width: 620px) { .d-wrap { grid-template-columns: 1fr; } .d-side { display: none; } }
.d-side { border-right: 1px solid var(--line); background: var(--panel-2); padding: 10px 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; color: var(--dim); }
.d-side .new { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--panel); color: var(--fg); text-align: center; margin-bottom: 8px; }
.d-side .ws { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 4px 6px; }
.d-side .s { padding: 4px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-side .s.on { background: var(--pop-soft); color: var(--fg); }
.d-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.d-head { padding: 8px 16px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; display: flex; gap: 14px; }
.d-head span { color: var(--dim); font-weight: 400; }
.d-log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.d-hint { color: var(--dim); text-align: center; margin: auto; font-family: var(--font-display); font-size: 20px; }
.d-user { align-self: flex-end; background: var(--pop-soft); border-radius: 12px; padding: 7px 12px; max-width: 85%; }
.d-think .h { color: var(--think); font-size: 12.5px; }
.d-think .tx { display: block; color: var(--dim); font-style: italic; white-space: pre-wrap; max-height: 4.7em; overflow: hidden; font-size: 12.5px; }
.d-think.closed .tx { display: none; }
.d-step { display: grid; grid-template-columns: 12px auto minmax(0, 1fr); gap: 4px 8px; align-items: center; font-size: 12.5px; }
.d-step .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--tool); }
.d-step.run .dot { background: var(--tool); animation: blink 1s steps(2, start) infinite; }
.d-step.ok .dot { background: var(--ok); border-color: var(--ok); }
.d-step.bad .dot { background: var(--err); border-color: var(--err); }
.d-step .nm { font-weight: 600; }
.d-step .arg { color: var(--dim); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-step .raw { grid-column: 2 / -1; font: 11px var(--font-mono); color: var(--dim); white-space: pre-wrap; }
.d-say { white-space: pre-wrap; }
.d-say code { font: 12px var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
.d-say strong { font-weight: 600; }
.d-done { color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
.d-composer { flex: none; margin: 0 14px 6px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); }
.d-input { flex: 1; min-height: 2.6em; font-size: 13px; color: var(--fg); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.d-input.ph { color: var(--dim); }
.d-send { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--pop); color: #fff; display: grid; place-items: center; font-size: 15px; transition: transform .12s; }
.d-send.press { transform: scale(.8); }
.d-send.busy { background: var(--fg); color: var(--bg); }
.d-foot { flex: none; font: 11px var(--font-mono); color: var(--dim); text-align: center; padding: 0 0 8px; min-height: 22px; font-variant-numeric: tabular-nums; }

/* IDE skin */
.i-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
@media (max-width: 620px) { .i-wrap { grid-template-columns: 1fr; } .i-editor { display: none; } }
.i-editor { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; min-height: 0; }
.i-tabs { display: flex; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); flex: none; }
.i-tabs span { padding: 5px 12px; color: var(--dim); border-right: 1px solid var(--line); }
.i-tabs span.on { background: var(--panel); color: var(--fg); box-shadow: inset 0 2px 0 var(--pop); }
.i-code { margin: 0; padding: 10px 0; font: 12.5px/1.7 var(--font-mono); flex: 1; overflow: auto; min-height: 0; }
.i-code .ln { display: grid; grid-template-columns: 3ch minmax(0, 1fr); gap: 14px; padding: 0 12px; white-space: pre; }
.i-code .n { color: var(--dim); text-align: right; }
.i-code .ln.del { background: color-mix(in srgb, var(--err) 14%, transparent); }
.i-code .ln.del .c { text-decoration: line-through; opacity: .7; }
.i-code .ln.add { background: color-mix(in srgb, var(--ok) 16%, transparent); }
.i-code .ln.look { background: var(--pop-soft); }
.kw { color: var(--think); } .fnn { color: var(--pop); } .str { color: var(--ok); } .num { color: var(--tool); }
.i-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel-2); }
.i-ph, .i-th { flex: none; font: 600 10.5px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.i-log { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
.i-input { flex: none; margin: 0 10px 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; color: var(--fg); background: var(--panel); min-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.i-input.ph { color: var(--dim); }
.i-term { height: 112px; flex: none; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.i-tl { margin: 0; padding: 6px 12px; font: 11.5px/1.5 var(--font-mono); overflow: auto; flex: 1; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.i-tl .cmd { color: var(--ok); } .i-tl .err { color: var(--err); } .i-tl .dim { color: var(--dim); }

/* Positions + editor */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.positions { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
@media (max-width: 900px) { .positions { position: static; } }
.pos-list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.grp { font: 600 10.5px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 8px 10px 3px; }
.pos { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 9px; border: 1px solid transparent; }
.pos:hover { background: var(--panel-2); }
.pos.active { background: var(--pop-soft); border-color: var(--pop); }
.pos .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); transition: box-shadow .1s; }
.pos.off .dot { background: transparent; border: 1.5px solid var(--line); }
.pos.hit .dot { box-shadow: 0 0 0 4px var(--pop-soft); }
.pos-sel { all: unset; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
.pos-sel b { font-weight: 600; font-size: 13.5px; }
.pos-sel span { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos-sel span em { font-style: normal; color: var(--pick); }
.pos-sel:focus-visible { outline: 2px solid var(--pop); outline-offset: 4px; border-radius: 4px; }
.tg { position: relative; display: inline-flex; cursor: pointer; }
.tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.tg input:checked + .sw { background: var(--c, var(--pop)); }
.tg input:checked + .sw::after { transform: translateX(12px); }
.tg input:focus-visible + .sw { outline: 2px solid var(--pop); outline-offset: 2px; }

.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ed-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ed-title i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.ed-title small { color: var(--dim); font-size: 12.5px; }
.kind { font: 600 10.5px var(--font-mono); color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.custom-badge { font: 600 10.5px var(--font-mono); color: var(--pick); border: 1px solid var(--pick); border-radius: 4px; padding: 0 6px; }
.ed-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ed-actions input[type=range] { width: 110px; }
.ed-actions output { font: 12px var(--font-mono); color: var(--dim); width: 3.4em; font-variant-numeric: tabular-nums; }

.preview { margin: 12px 14px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 8px 12px 10px; height: 128px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 4px; font: 12.5px/1.55 var(--font-mono); overflow: hidden; }
.pv-label { font: 600 10.5px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-body { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; overflow-wrap: anywhere; gap: 2px; }
.pv-text { white-space: pre-wrap; }
.pv-think .pv-text { color: var(--dim); font-style: italic; }
.pv-typing .pv-text { color: var(--tool); }
.pv-line { color: var(--dim); white-space: pre-wrap; }
.pv-line b { color: var(--fg); font-weight: 600; }
.pv-line .ok { color: var(--ok); } .pv-line .bad { color: var(--err); }
.pv-user { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; max-width: 92%; font-family: var(--font-ui); }
.pv-ask { border: 1px solid var(--pick); border-radius: 8px; padding: 6px 10px; font-family: var(--font-ui); }
.pv-ask b { font-family: var(--font-mono); font-weight: 600; }
.pv-ask .opts { display: flex; gap: 6px; margin-top: 5px; }
.pv-ask .opts span { border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font-size: 12px; }
.caret { display: inline-block; width: .5em; height: 1em; vertical-align: -0.15em; background: var(--pop); margin-left: 1px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.sec { padding: 12px 14px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec h3 { font: 600 13px var(--font-ui); margin: 0; }
.sec small { color: var(--dim); font-size: 12px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 6px 14px 4px; }
.snd { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 9px; padding: 7px 10px; cursor: pointer; font: inherit; min-width: 0; display: flex; flex-direction: column; gap: 1px; position: relative; overflow: hidden; }
.snd:hover { border-color: var(--dim); }
.snd[aria-checked="true"] { border-color: var(--pop); box-shadow: inset 0 0 0 1px var(--pop); background: var(--pop-soft); }
.snd b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd span { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd.off b { color: var(--dim); }
.snd.sounding::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--pop); transform-origin: left; animation: grow var(--dur, 1s) linear forwards; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 22px; padding: 6px 14px 14px; }
@media (max-width: 620px) { .knobs { grid-template-columns: 1fr; } }
.knob { display: grid; grid-template-columns: 92px minmax(0, 1fr) 74px; gap: 8px; align-items: center; min-height: 32px; }
.knob label { font-size: 12.5px; color: var(--fg); }
.knob output { font: 11.5px var(--font-mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.knob input[type=range] { width: 100%; }
.knob select { width: 100%; font: 12.5px var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.knob.wide { grid-column: 1 / -1; grid-template-columns: 92px minmax(0, 1fr); }
.knob.na { opacity: .4; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 12px var(--font-ui); color: var(--dim); background: transparent; border: 0; padding: 4px 9px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--pop-soft); box-shadow: inset 0 -2px 0 var(--pop); }

.vol { display: flex; align-items: center; gap: 8px; }
#vol { width: 90px; }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .snd.sounding::after { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>tokenpop <span>Sound Lab</span></h1>
      <p class="intro">Pick a theme to hear and see it in a real session. Then open any sound position to swap its sound from the library or shape your own.</p>
    </div>
    <div class="top-actions">
      <div class="vol"><label class="label" for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="55"></div>
      <button class="btn primary" id="copy" type="button">Copy config</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="hero">
    <section class="panel" aria-label="Themes">
      <div class="panel-head"><h2>Themes</h2><span class="label">Click to apply</span></div>
      <div class="axis-v" aria-hidden="true"><span class="q">Quiet</span><span class="bar"></span><span class="l">Lively</span></div>
      <ul class="tlist" id="themes"></ul>
    </section>

    <section class="panel" aria-label="Live preview">
      <div class="stage-head">
        <div class="stage-left">
          <div class="seg" role="group" aria-label="Agent app style" id="skins"></div>
          <span class="like" id="like"></span>
        </div>
        <div class="stage-right">
          <span class="now-pill" id="now-pill" aria-hidden="true"><i></i><span>Silent</span></span>
          <button class="btn primary" id="full" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span>Play session</span></button>
        </div>
      </div>
      <div class="stage-body" id="stage"></div>
      <div class="stage-prog"><i id="prog"></i></div>
    </section>
  </div>

  <div class="layout">
    <section class="panel positions" aria-label="Sound positions">
      <div class="panel-head"><h2>Where sounds play</h2></div>
      <ul class="pos-list" id="pos-list"></ul>
    </section>

    <div class="main">
      <section class="panel" aria-label="Sound editor" id="editor">
        <div class="panel-head">
          <div class="ed-title" id="ed-title"></div>
          <div class="ed-actions">
            <label class="tg" id="ed-on-wrap" title="Turn this position on or off"><input type="checkbox" id="ed-on" aria-label="Position on"><span class="sw"></span></label>
            <label class="label" for="ed-level">Level</label>
            <input type="range" id="ed-level" min="0" max="150" step="5">
            <output id="ed-level-out" for="ed-level"></output>
            <button class="btn" id="ed-play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Play</button>
          </div>
        </div>
        <div class="preview" id="preview" aria-hidden="true"><span class="pv-label" id="pv-label"></span><div class="pv-body" id="pv-body"></div></div>
        <div class="sec"><h3>Sound library</h3><small id="lib-note"></small></div>
        <div class="lib" id="lib" role="radiogroup"></div>
        <div class="sec"><h3>Shape it</h3><button class="btn small" id="ed-reset" type="button">Reset to library sound</button></div>
        <div class="knobs" id="knobs"></div>
      </section>

    </div>
  </div>
</div>

const WORKLET_SRC =

  'class TokenPop extends AudioWorkletProcessor {\n' +
  '  constructor() { super(); this.e = new Engine(sampleRate);\n' +
  '    this.port.onmessage = (m) => { const d = m.data;\n' +
  '      if (d.t === "ev") this.e.push(d.ev); else if (d.t === "preset") { this.e.panic(); this.e.P = d.v; } else if (d.t === "panic") this.e.panic(); }; }\n' +
  '  process(_i, outs) { const o = outs[0]; const L = o[0]; const R = o[1] || new Float32Array(L.length);\n' +
  '    this.e.render(L, R); const p = this.e.takePops(); if (p.length) this.port.postMessage(p); return true; }\n' +
  '}\nregisterProcessor("tokenpop", TokenPop);\n';

let volume = 0.55;

  ctx: null, node: null, gain: null, queue: [], ready: null,

    this.ctx = ctx;
    this.gain = ctx.createGain(); this.gain.gain.value = volToGain(volume); this.gain.connect(ctx.destination);
    this.ready = (async () => {
      try {
        const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        const node = new AudioWorkletNode(ctx, 'tokenpop', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
        node.port.onmessage = (m) => onPops(m.data);
        node.connect(this.gain); this.node = node;

        const { Engine } = engineFactory();
        const eng = new Engine(ctx.sampleRate);
        const sp = ctx.createScriptProcessor(1024, 1, 2);

let clip = null;
function play(events, preset, onEvent, opts) {
  stopClip(true);
  Audio.init().then(() => {
    Audio.post({ t: 'preset', v: preset });
    clip = Object.assign({ events, i: 0, t0: performance.now() + 80, onEvent, len: (events.length ? events[events.length - 1][0] : 0) + 700 }, opts);
    if (clip.onStart) clip.onStart();

}
function stopClip(quiet) {

  if (c && c.onStop) c.onStop();

}
const post = (kind, extra) => Audio.post({ t: 'ev', ev: Object.assign({ agent: 'dsh', kind, chars: 0, h: 0 }, extra || {}) });
function tick(now) {
  if (clip) {
    const el = now - clip.t0;
    while (clip && clip.i < clip.events.length && clip.events[clip.i][0] <= el) clip.onEvent(clip.events[clip.i++], el);
    if (clip && clip.onFrame) clip.onFrame(el);
    if (clip && el > clip.len) { const c = clip; clip = null; if (c.onStop) c.onStop(); }

}

const firstLines = (out, n) => {

/* A transcript renderer shared by the skins; `cls` sets each skin's markup. */
function chatLog(logEl, cls) {
  let cur = null, tools = [];
  const add = (html, c) => { const d = document.createElement('div'); d.className = c; d.innerHTML = html; logEl.appendChild(d); return d; };
  const scroll = () => { logEl.scrollTop = logEl.scrollHeight; };
  function close(el) {
    if (cur && cur.k === 'r') { cur.d.classList.add('closed'); cur.d.querySelector('.h').textContent = cls.thought(((el - cur.t) / 1000).toFixed(1)); }
    cur = null;
  }
  function newTool(name) {
    const d = add('<span class="dot"></span><span class="nm">' + esc(TOOLN[name] || name) + '</span><span class="arg"></span><div class="raw"></div>', cls.step);
    const t = { name, d, raw: '', started: false, ended: false, argEl: d.querySelector('.arg'), rawEl: d.querySelector('.raw') };
    tools.push(t); cur = t; return t;
  }
  return {
    reset() { cur = null; tools = []; },
    user(p) { add(esc(p), cls.user); scroll(); },
    think(s, el) {
      if (!cur || cur.k !== 'r') { close(el); cur = { k: 'r', d: add('<span class="h">' + cls.thinking + '</span><span class="tx"></span>', cls.think), raw: '', t: el }; }
      cur.raw += s; const tx = cur.d.querySelector('.tx'); tx.textContent = cur.raw; tx.appendChild(caret); scroll();
    },
    write(s, el) {
      if (!cur || cur.k !== 'x') { close(el); cur = { k: 'x', d: add('', cls.say), raw: '' }; }
      cur.raw += s; cur.d.innerHTML = (cls.sayPrefix || '') + md(cur.raw); cur.d.appendChild(caret); scroll();
    },
    toolArgs(s, name, el) {
      let t = cur && cur.rawEl ? cur : null;
      if (name || !t) { close(el); t = newTool(name || 'tool'); }
      t.raw += s; t.rawEl.textContent = t.raw; t.rawEl.appendChild(caret); scroll();
    },
    toolStart(name, sum) {
      const t = tools.find((x) => !x.started && x.name === name) || tools.find((x) => !x.started) || newTool(name);
      t.started = true; t.argEl.textContent = cls.argFmt(sum);
      if (t.rawEl) { t.rawEl.remove(); t.rawEl = null; }
      if (cur === t) cur = null;
      t.d.classList.add('run'); scroll();
    },
    toolEnd(name, out, err) {
      const t = tools.find((x) => x.started && !x.ended && x.name === name) || tools.find((x) => x.started && !x.ended);
      if (!t) return;
      t.ended = true; t.d.classList.remove('run'); t.d.classList.add(err ? 'bad' : 'ok');
      if (cls.out) { const o = document.createElement('div'); o.className = cls.out; o.textContent = '⎿  ' + firstLines(out, 2).split('\n').join('\n   '); t.d.appendChild(o); }
      scroll();
    },
    done(text, el) { close(el); caret.remove(); if (text) add(text, cls.done); scroll(); },
  };
}

      if (!inner) { pvBody.innerHTML = '<div class="pv-text"></div>'; inner = pvBody.firstChild; }
      inner.innerHTML = kind === 'text' ? md(raw) : esc(raw); inner.appendChild(caret);
      if (v.text) post(kind, { chars: v.text.length, h: hash8(v.text) });
      return;
    }
    if (v.user) pvBody.innerHTML = '<div class="pv-user">' + esc(v.user) + '</div>';
    if (v.para) { const d = document.createElement('div'); d.className = 'pv-text'; d.innerHTML = md(v.para); pvBody.appendChild(d); }
    if (v.line) { const d = document.createElement('div'); d.className = 'pv-line'; d.innerHTML = v.line; pvBody.appendChild(d); }
    if (v.ask) pvBody.innerHTML = '<div class="pv-ask">Allow <b>' + esc(v.ask) + '</b>?<div class="opts"><span>Allow</span><span>Deny</span></div></div>';
    if (kind) post(kind);
  }, {
    onStart: () => {
      pvBody.innerHTML = '';
      libEl.querySelectorAll('.snd.sounding').forEach((t) => t.classList.remove('sounding'));
      if (tile) { tile.style.setProperty('--dur', (events[events.length - 1][0] + 700) + 'ms'); void tile.offsetWidth; tile.classList.add('sounding'); }
    },
    onStop: () => { caret.remove(); libEl.querySelectorAll('.snd.sounding').forEach((t) => t.classList.remove('sounding')); },
  });
}

/* ======================= Editor ======================= */
const libEl = document.getElementById('lib'), knobsEl = document.getElementById('knobs');
const ms = (v) => (v >= 1 ? 'sustain' : Math.round(v * 1000) + ' ms');
const pct = (v) => Math.round(v * 100) + '%';
const PATTERNS = [['single', 'Single', [0]], ['repeat', 'Repeat twice', [0, 0]], ['repeat3', 'Repeat three', [0, 0, 0]], ['up2', 'Two up', [7, 12]],
  ['up3', 'Three up', [0, 4, 7]], ['arp', 'Arpeggio up', [0, 4, 7, 12]], ['down3', 'Three down', [12, 7, 0]], ['fourth', 'Fourth up', [0, 5]], ['tritone', 'Tritone', [-12, -6]]];
const KNOBS = [
  { k: 'w', label: 'Wave', type: 'seg', wide: true, opts: [['sine', 'Sine'], ['tri', 'Triangle'], ['square', 'Square'], ['pulse', 'Narrow pulse'], ['noise', 'Noise']] },
  { k: 'oct', label: 'Pitch', min: -24, max: 36, step: 1, fmt: (v) => (v > 0 ? '+' : '') + v + ' st', pitched: true },
  { k: 'slide', label: 'Bend', min: .3, max: 3, step: .01, fmt: (v) => (v >= 1 ? '+' : '') + Math.round((v - 1) * 100) + '%', pitched: true },
  { k: 'dur', label: 'Length', min: .005, max: .8, step: .005, fmt: ms },
  { k: 'att', label: 'Attack', min: 0, max: .06, step: .0005, fmt: ms },
  { k: 'dec', label: 'Decay', min: .002, max: 1, step: .002, fmt: ms },
  { k: 'lp', label: 'Brightness', min: 0, max: 10000, step: 100, fmt: (v) => v ? Math.round(v) + ' Hz' : 'Open' },
  { k: 'noise', label: 'Noise', min: 0, max: 1, step: .05, fmt: pct, pitched: true },
  { k: 'shimmer', label: 'Shimmer', min: 0, max: .6, step: .02, fmt: pct, pitched: true },
  { k: 'thump', label: 'Thump', min: 0, max: 1.5, step: .05, fmt: pct },
  { k: 'rnd', label: 'Variation', min: 0, max: 1, step: .05, fmt: pct },
  { k: 'melody', label: 'Melody', type: 'select', only: 'tick', pitched: true, opts: [['penta', 'Pentatonic'], ['major', 'Major, wide'], ['minor', 'Minor, wide'], ['single', 'One note']] },
  { k: 'cpp', label: 'Density', only: 'tick', min: 1, max: 20, step: 1, fmt: (v) => '1 per ' + v + ' chars' },
  { k: 'rate', label: 'Max rate', only: 'tick', min: 3, max: 45, step: 1, fmt: (v) => v + ' per s' },
  { k: 'jit', label: 'Looseness', only: 'tick', min: 0, max: .9, step: .05, fmt: pct },
  { k: 'spread', label: 'Stereo', only: 'tick', min: 0, max: 1, step: .05, fmt: pct },
  { k: 'pattern', label: 'Pattern', type: 'select', only: 'cue', pitched: true, opts: PATTERNS.map((p) => [p[0], p[1]]).concat([['custom', 'Custom']]) },
  { k: 'step', label: 'Spacing', only: 'cue', min: 0, max: .3, step: .005, fmt: (v) => v ? Math.round(v * 1000) + ' ms' : 'together' },
  { k: 'click', label: 'Click', only: 'cue', min: 0, max: 1, step: .05, fmt: pct },
];
function patternOf(notes) { const p = PATTERNS.find((x) => JSON.stringify(x[2]) === JSON.stringify(notes)); return p ? p[0] : 'custom'; }
function renderEditor() {
  renderHead();
  renderLibAndKnobs();
}
function renderHead() {
  const p = P_BY[active], x = st[active];
  document.getElementById('editor').style.setProperty('--c', p.c);
  document.getElementById('ed-title').innerHTML = '<i></i><h2>' + p.label + '</h2><span class="kind">' + (p.type === 'tick' ? 'per token' : 'one-shot') + '</span>' +
    (x.custom ? '<span class="custom-badge">edited</span>' : '') + '<small>' + p.where + '</small>';
  document.getElementById('ed-on').checked = x.on;
  document.getElementById('ed-on-wrap').style.setProperty('--c', p.c);
  const lv = document.getElementById('ed-level'); lv.value = x.level; lv.disabled = !x.on;
  document.getElementById('ed-level-out').textContent = x.level + '%';
  document.getElementById('ed-reset').disabled = !x.custom;
}
function renderLibAndKnobs() {
  const p = P_BY[active], x = st[active];
  document.getElementById('lib-note').textContent = p.type === 'tick' ? 'Plays repeatedly while tokens stream' : 'Plays once per event';
  // Library: sounds of this position's kind.
  const list = p.type === 'tick' ? TICKS : CUES;
  libEl.setAttribute('aria-label', p.label + ' sound');
  libEl.innerHTML = '<button class="snd off" type="button" role="radio" aria-checked="' + !x.on + '" data-id="off"><b>Silent</b><span>No sound here</span></button>' +
    list.map((s) => '<button class="snd" type="button" role="radio" aria-checked="' + (x.on && x.lib === s.id) + '" data-id="' + s.id + '"><b>' + esc(s.name) + '</b><span>' + esc(s.line) + '</span></button>').join('');
  // Knobs.
  const noise = x.s.w === 'noise';
  knobsEl.innerHTML = KNOBS.filter((k) => !k.only || k.only === p.type).map((k) => {
    const na = (k.pitched && noise) || !x.on;
    let ctl, val = k.k === 'pattern' ? patternOf(x.s.notes) : x.s[k.k];
    if (k.type === 'seg') ctl = '<div class="seg" role="group" aria-label="' + k.label + '">' + k.opts.map((o) => '<button type="button" data-k="' + k.k + '" data-v="' + o[0] + '" aria-pressed="' + (val === o[0]) + '"' + (x.on ? '' : ' disabled') + '>' + o[1] + '</button>').join('') + '</div>';
    else if (k.type === 'select') ctl = '<select id="k-' + k.k + '" data-k="' + k.k + '"' + (na ? ' disabled' : '') + '>' + k.opts.map((o) => '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
    else ctl = '<input type="range" id="k-' + k.k + '" data-k="' + k.k + '" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '" value="' + val + '"' + (na ? ' disabled' : '') + '>';
    return '<div class="knob' + (k.wide ? ' wide' : '') + (na ? ' na' : '') + '"><label' + (k.type === 'seg' ? '' : ' for="k-' + k.k + '"') + '>' + k.label + '</label>' + ctl +
      (k.type ? '' : '<output data-out="' + k.k + '">' + k.fmt(+val) + '</output>') + '</div>';
  }).join('');
}
function markEdited() {
  const x = st[active];
  if (!x.custom) { x.custom = true; renderHead(); }
  save(); renderPositions(); renderThemes();
}
libEl.addEventListener('click', (e) => {
  const b = e.target.closest('.snd'); if (!b) return;
  const x = st[active];
  if (b.dataset.id === 'off') { x.on = false; stopClip(); }
  else { x.on = true; x.lib = b.dataset.id; x.custom = false; x.s = clone(LIB[b.dataset.id].s); }
  save(); renderPositions(); renderThemes(); renderEditor(); renderPhases();
  if (x.on) { solo(); const t = libEl.querySelector('[data-id="' + b.dataset.id + '"]'); if (t) t.focus(); }
});
libEl.addEventListener('keydown', (e) => {
  const tiles = [...libEl.querySelectorAll('.snd')], i = tiles.indexOf(document.activeElement);
  if (i < 0) return;
  const cols = Math.max(1, Math.round(libEl.clientWidth / tiles[0].offsetWidth));
  const stepBy = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
  if (stepBy) { e.preventDefault(); tiles[(i + stepBy + tiles.length) % tiles.length].click(); }
});
knobsEl.addEventListener('input', (e) => {
  const k = e.target.dataset.k; if (!k || e.target.tagName !== 'INPUT') return;
  st[active].s[k] = +e.target.value;
  const out = knobsEl.querySelector('[data-out="' + k + '"]'); if (out) out.textContent = KNOBS.find((x) => x.k === k).fmt(+e.target.value);
  markEdited();
});
knobsEl.addEventListener('change', (e) => {
  const k = e.target.dataset.k; if (!k) return;
  if (e.target.tagName === 'SELECT') {
    if (k === 'pattern') { const p = PATTERNS.find((x) => x[0] === e.target.value); if (p) { st[active].s.notes = p[2].slice(); if (!st[active].s.step && p[2].length > 1 && p[0] !== 'tritone') st[active].s.step = .07; } }
    else st[active].s[k] = e.target.value;
    markEdited(); renderEditor();
  }
  solo();
});
knobsEl.addEventListener('click', (e) => {
  const b = e.target.closest('.seg button'); if (!b) return;
  st[active].s[b.dataset.k] = b.dataset.v;
  markEdited(); renderEditor(); solo();
});
document.getElementById('ed-reset').addEventListener('click', () => {
  const x = st[active]; x.s = clone(LIB[x.lib].s); x.custom = false;
  save(); renderAll(); solo();
});
document.getElementById('ed-on').addEventListener('change', (e) => { st[active].on = e.target.checked; save(); renderAll(); if (e.target.checked) solo(); else stopClip(); });
const lvEl = document.getElementById('ed-level');
lvEl.addEventListener('input', () => { st[active].level = +lvEl.value; document.getElementById('ed-level-out').textContent = lvEl.value + '%'; save(); renderPositions(); renderThemes(); });
lvEl.addEventListener('change', () => solo());
document.getElementById('ed-play').addEventListener('click', () => { if (st[active].on) solo(); else status('This position is silent'); });

/* ======================= Export ======================= */
function config() {
  const cur = currentTheme();
  const lines = ['# tokenpop sound config', 'theme = "' + (cur ? cur.id : 'custom') + '"', ''];
  for (const p of POS) {
    const x = st[p.id];
    lines.push('[sounds.' + p.id + ']');
    if (!x.on) { lines.push('enabled = false', ''); continue; }
    lines.push('sound = "' + x.lib + '"', 'level = ' + x.level);
    if (x.custom) {
      const base = LIB[x.lib].s;
      for (const k of Object.keys(x.s)) if (JSON.stringify(x.s[k]) !== JSON.stringify(base[k])) lines.push(k + ' = ' + JSON.stringify(x.s[k]));
    }
    lines.push('');
  }
  return lines.join('\n');
}
document.getElementById('copy').addEventListener('click', () => {
  const text = config();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
    status(ok ? 'Copied' : 'Copy failed');
  };
  try { navigator.clipboard.writeText(text).then(() => status('Copied'), fallback); } catch (e) { fallback(); }
});
document.getElementById('vol').addEventListener('input', (e) => {
  volume = e.target.value / 100;
  if (Audio.gain) Audio.gain.gain.setTargetAtTime(volToGain(volume), Audio.ctx.currentTime, 0.02);
});

function renderAll() { renderThemes(); renderPositions(); renderEditor(); renderPhases(); }
renderAll(); mountSkin();
pvLabel.textContent = 'Solo preview'; pvBody.innerHTML = '<div class="pv-line">Pick a position on the left, then click sounds to hear it on its own.</div>';
requestAnimationFrame(tick);
</script>
